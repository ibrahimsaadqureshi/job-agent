[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "jobagent"
version = "2.0.0"
description = "Daily remote-job pipeline: fetch, filter, score with a free LLM, track in Google Sheets, digest to Slack."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "requests>=2.32",
    "beautifulsoup4>=4.12",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
sheets = ["gspread>=6.1", "google-auth>=2.30"]
resume = ["pypdf>=5.0"]
dev = ["pytest>=8.0"]

[tool.setuptools.packages.find]
include = ["jobagent*"]

[tool.setuptools.package-data]
jobagent = ["prompts/*.txt"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
