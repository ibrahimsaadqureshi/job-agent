# The daily job run: fetch, filter, score, append to the Sheet, send the Slack digest.
# Logs are public once the repo is public, so the pipeline prints counts only.
name: Daily run

on:
  # GitHub may delay or drop scheduled runs when Actions is busy, and the top of the hour is
  # the busiest time, so both slots sit off the hour. The second slot is a backup: the
  # `check` job below skips it when a run already succeeded today (UTC), so there's still
  # one digest a day.
  schedule:
    - cron: "17 2 * * *" # 02:17 UTC = 07:17 Pakistan time
    - cron: "47 4 * * *" # 04:47 UTC = 09:47 Pakistan time (backup)
  workflow_dispatch:
    inputs:
      limit:
        description: "Score at most this many jobs (blank = the usual 200)"
        type: string
        required: false
        default: ""

# Read-only. (GitHub Models, the planned free fallback, was retired by GitHub in 2026, so the
# run no longer asks for models: read or passes GITHUB_TOKEN to the app. Jobs that Gemini
# can't score stay unscored and are retried the next day.)
permissions:
  contents: read

concurrency:
  group: daily-run
  cancel-in-progress: false # a second run waits instead of overlapping

jobs:
  # Scheduled runs only: skip if a run of this workflow already succeeded today (UTC).
  # Manual runs always go ahead.
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: read
    outputs:
      go: ${{ steps.decide.outputs.go }}
    steps:
      - id: decide
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
        run: |
          if [ "$EVENT" != "schedule" ]; then
            echo "go=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          today=$(date -u +%Y-%m-%d)
          done_today=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow daily.yml \
            --status success --created ">=$today" --json databaseId --jq 'length')
          if [ "$done_today" -gt 0 ]; then
            echo "A run already succeeded today; skipping this slot."
            echo "go=false" >> "$GITHUB_OUTPUT"
          else
            echo "go=true" >> "$GITHUB_OUTPUT"
          fi

  run:
    needs: check
    if: needs.check.outputs.go == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      # No resume extra: CI reads the profile from the CANDIDATE_PROFILE secret.
      - name: Install
        run: pip install -e '.[sheets]'

      - name: Run the pipeline
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          SHEET_ID: ${{ secrets.SHEET_ID }}
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          CANDIDATE_PROFILE: ${{ secrets.CANDIDATE_PROFILE }}
          PYTHONUNBUFFERED: "1" # keep printed counts and warnings in order
          LIMIT_INPUT: ${{ inputs.limit }}
        run: |
          args=(run)
          if [ -n "$LIMIT_INPUT" ]; then
            if ! [[ "$LIMIT_INPUT" =~ ^[0-9]+$ ]]; then
              echo "error: limit must be a whole number" >&2
              exit 2
            fi
            args+=(--limit "$LIMIT_INPUT")
          fi
          python -m jobagent "${args[@]}"
