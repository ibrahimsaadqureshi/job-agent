# GitHub turns off scheduled workflows in a public repo after 60 days with no repo
# activity. Re-enabling a workflow through the API resets that counter, so this runs
# twice a month (scheduled runs are sometimes skipped) and re-enables both scheduled
# workflows. No commits are made.
name: Keepalive

on:
  schedule:
    - cron: "17 4 1,15 * *"
  workflow_dispatch:

permissions:
  actions: write # needed for the enable-workflow API, nothing else

jobs:
  enable:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Re-enable the scheduled workflows
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          for wf in daily.yml keepalive.yml; do
            gh api --method PUT "repos/$REPO/actions/workflows/$wf/enable" --silent
            echo "enabled $wf"
          done
